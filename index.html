<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO - Indian AI Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #d1d1d1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 20px; text-align: center; font-size: 1.5rem; font-weight: bold; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #e5ddd5; }
        .msg { max-width: 80%; padding: 12px; border-radius: 12px; font-size: 1rem; line-height: 1.4; word-wrap: break-word; position: relative; }
        .bot { background: white; align-self: flex-start; color: black; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .user { background: #dcf8c6; align-self: flex-end; color: black; box-shadow: -2px 2px 5px rgba(0,0,0,0.1); }
        .input-area { background: #f0f0f0; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ccc; }
        input { flex: 1; border: none; padding: 12px; border-radius: 25px; outline: none; font-size: 1rem; border: 1px solid #ddd; }
        button { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        #typing { font-size: 12px; color: #555; padding-left: 25px; display: none; background: #e5ddd5; }
    </style>
</head>
<body>

<div class="header">LEO Assistant (by Ritesh)</div>

<div id="chat-box"></div>
<div id="typing">Leo is thinking...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Say hello to Leo...">
    <button onclick="sendMessage()">➔</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const typing = document.getElementById('typing');

    // --- INDIAN FEMALE HINDI VOICE ---
    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;

        const voices = window.speechSynthesis.getVoices();
        // Priority 1: Hindi Indian Female voice
        // Priority 2: English Indian Female voice
        let selectedVoice = voices.find(v => v.lang === 'hi-IN') || 
                            voices.find(v => v.lang.includes('en-IN') && v.name.includes('Female')) ||
                            voices.find(v => v.lang.includes('hi')) ||
                            voices[0];

        msg.voice = selectedVoice;
        msg.pitch = 1.2; 
        msg.rate = 1.0; 
        window.speechSynthesis.speak(msg);
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- AI Brain Logic ---
    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query) return;

        addMessage(query, 'user');
        userInput.value = '';
        typing.style.display = 'block';

        // LEO Identity settings
        const promptPrefix = "Your name is Leo. You were made by Ritesh. You are a friendly Indian female friend assistant. Answer in friendly English or Hindi. User message: ";

        try {
            // Using a more reliable "GET" connection for simple browser compatibility
            const apiURL = `https://text.pollinations.ai/${encodeURIComponent(promptPrefix + query)}?model=openai`;
            
            const response = await fetch(apiURL);
            const reply = await response.text();

            typing.style.display = 'none';
            addMessage(reply, 'bot');
            speak(reply);

        } catch (error) {
            console.error(error);
            typing.style.display = 'none';
            addMessage("Mujhe connectivity problem ho rahi hai. Please try again later!", 'bot');
        }
    }

    // This triggers voices to load properly
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

    // --- When the App star
