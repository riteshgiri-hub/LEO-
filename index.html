<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO by Ritesh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b141a; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #202c33; padding: 15px; text-align: center; border-bottom: 2px solid #00a884; }
        .header h1 { margin: 0; font-size: 20px; color: #00a884; }
        .header p { margin: 5px 0 0; font-size: 12px; color: #aebac1; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; }
        .bubble { max-width: 80%; padding: 12px; border-radius: 10px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .leo-msg { background: #202c33; align-self: flex-start; color: #e9edef; border-bottom-left-radius: 0; }
        .user-msg { background: #005c4b; align-self: flex-end; color: white; border-bottom-right-radius: 0; }
        .input-area { background: #202c33; padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; font-size: 16px; }
        button { background: #00a884; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; font-size: 20px; }
        #typing { font-size: 12px; color: #00a884; padding-left: 15px; display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>LEO</h1>
    <p>Official Assistant by Ritesh</p>
</div>

<div id="chat-window"></div>
<div id="typing">Leo is thinking...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask Leo something...">
    <button id="sendBtn">➔</button>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');

    // Indian Female Voice
    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const femaleIndian = voices.find(v => v.lang.includes('hi') || v.lang.includes('en-IN')) || voices[0];
        msg.voice = femaleIndian;
        msg.pitch = 1.2;
        window.speechSynthesis.speak(msg);
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `bubble ${sender === 'leo' ? 'leo-msg' : 'user-msg'}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        typing.style.display = 'block';

        try {
            // Using a system instruction to make her smart
            const api = `https://text.pollinations.ai/${encodeURIComponent(text)}?system=You are Leo, a smart girl assistant made by Ritesh. Be friendly and Indian.`;
            const response = await fetch(api);
            const data = await response.text();

            typing.style.display = 'none';
            addMessage(data, 'leo');
            speak(data);
        } catch (e) {
            typing.style.display = 'none';
            addMessage("Mujhe connectivity issue aa rahi hai. Par main theek hoon!", "leo");
        }
    }

    // Button Click
    sendBtn.onclick = handleChat;

    // Enter Key
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleChat();
    });

    window.onload = () => {
        const welcomeText = "Mujhe Ritesh ne banaya hai. I am Leo! Hello, how can I help you today?";
        addMessage(welcomeText, 'leo');
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    };
</script>

</body>
</html>
