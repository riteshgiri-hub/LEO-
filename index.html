<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO - Indian AI</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; }
        .user { background: #dcf8c6; align-self: flex-end; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; border: none; padding: 10px; border-radius: 20px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        #typing { display: none; padding-left: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div class="header">
    <strong>LEO</strong><br><small>Created by Ritesh</small>
</div>

<div id="chat-box"></div>
<div id="typing">Leo is thinking...</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const typing = document.getElementById('typing');

    // Indian Female Voice
    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        // Look for Hindi or Indian English Female
        const indVoice = voices.find(v => v.lang.includes('hi-IN')) || 
                         voices.find(v => v.lang.includes('en-IN') && v.name.includes('Female')) ||
                         voices[0];
        msg.voice = indVoice;
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }

    function addMsg(text, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = text;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const val = userInput.value.trim();
        if(!val) return;

        addMsg(val, 'user');
        userInput.value = '';
        typing.style.display = 'block';

        // NEW STABLE CONNECTION
        try {
            const systemPrompt = "Your name is Leo. You were made by Ritesh. You are a friendly Indian girl assistant. Talk in English/Hindi mix. Always start by being friendly.";
            const response = await fetch("https://text.pollinations.ai/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: val }
                    ],
                    model: "openai" 
                })
            });

            const data = await response.text();
            typing.style.display = 'none';
            addMsg(data, 'bot');
            speak(data);
        } catch (e) {
            typing.style.display = 'none';
            addMsg("Connection Error. Please check your internet and try again!", 'bot');
        }
    }

    window.onload = () => {
        const welcome = "Hello! Mujhe Ritesh ne banaya hai. I am Leo, your smart assistant. How can I help you today?";
        addMsg(welcome, 'bot');
    };

    userInput.addEventListener("keypress", (e) => { if(e.key === 'Enter') sendMessage(); });
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>

</body>
</html>
