<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO - Friendly AI</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header small { display: block; font-size: 0.7rem; opacity: 0.8; }

        /* Chat Area */
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 1rem; line-height: 1.4; position: relative; }
        .bot { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
        .user { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }

        /* Input Area */
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; border: none; padding: 12px; border-radius: 25px; outline: none; font-size: 1rem; }
        button { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="header">
    LEO
    <small>Created by Ritesh</small>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">➔</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');

    // Indian Female Voice Function
    function speak(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        const voices = window.speechSynthesis.getVoices();
        // Try to find Indian English female voice
        const indianVoice = voices.find(v => v.lang === 'en-IN' && v.name.includes('Female')) || 
                           voices.find(v => v.lang === 'en-IN') || 
                           voices[0];
        msg.voice = indianVoice;
        window.speechSynthesis.speak(msg);
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        setTimeout(() => {
            let reply = "I'm Leo! I'm here to chat with you in a friendly way.";
            
            if (text.toLowerCase().includes("hello") || text.toLowerCase().includes("hi")) {
                reply = "Hello friend! How can I help you today?";
            } else if (text.toLowerCase().includes("who") && text.toLowerCase().includes("made")) {
                reply = "Mujhe Ritesh ne banaya hai.";
            }

            addMessage(reply, 'bot');
            speak(reply);
        }, 800);
    }

    // First Intro when page opens
    window.onload = () => {
        const intro = "Hello! Mujhe Ritesh ne banaya hai. I am Leo, your friendly assistant. How can I help you?";
        addMessage(intro, 'bot');
        // Voice needs a user interaction to start in most browsers
        console.log("Leo is ready.");
    };

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    // Load voices
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>

</body>
</html>
